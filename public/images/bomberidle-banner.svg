<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1330 552" width="1330" height="552" role="img" aria-label="Bomber Idle banner" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0a1f"/>
      <stop offset="0.55" stop-color="#241046"/>
      <stop offset="1" stop-color="#0a0f1f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff9a1f" stop-opacity="0.85"/>
      <stop offset="0.5" stop-color="#ff5a1f" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#ff5a1f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bomb" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#4a4f7a"/>
      <stop offset="0.5" stop-color="#1a1c38"/>
      <stop offset="1" stop-color="#07081a"/>
    </radialGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b6ff00" stop-opacity="0"/>
      <stop offset="1" stop-color="#b6ff00" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="block" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c98a4a"/>
      <stop offset="1" stop-color="#8a5526"/>
    </linearGradient>
    <filter id="neon" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#8a2be2" stroke-opacity="0.22" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1330" height="552" fill="url(#bg)"/>
  <rect width="1330" height="552" fill="url(#grid)"/>

  <!-- neon floor perspective -->
  <g stroke="#b6ff00" stroke-opacity="0.35" stroke-width="1.2" fill="none">
    <path d="M0 552 L1330 552"/>
    <path d="M0 500 L1330 500" stroke-opacity="0.2"/>
    <path d="M0 460 L1330 460" stroke-opacity="0.12"/>
    <path d="M665 400 L-200 552"/><path d="M665 400 L120 552"/><path d="M665 400 L420 552"/>
    <path d="M665 400 L665 552"/>
    <path d="M665 400 L910 552"/><path d="M665 400 L1210 552"/><path d="M665 400 L1530 552"/>
  </g>
  <rect y="400" width="1330" height="152" fill="url(#floor)" opacity="0.5"/>

  <!-- left: block field -->
  <g>
    <g transform="translate(60 120)">
      <g fill="url(#block)" stroke="#5a3515" stroke-width="2">
        <rect x="0" y="0" width="54" height="54" rx="4"/><rect x="108" y="0" width="54" height="54" rx="4"/>
        <rect x="54" y="54" width="54" height="54" rx="4"/><rect x="162" y="54" width="54" height="54" rx="4"/>
        <rect x="0" y="108" width="54" height="54" rx="4"/><rect x="108" y="108" width="54" height="54" rx="4"/>
        <rect x="54" y="162" width="54" height="54" rx="4"/><rect x="216" y="162" width="54" height="54" rx="4"/>
        <rect x="0" y="216" width="54" height="54" rx="4"/><rect x="162" y="216" width="54" height="54" rx="4"/>
      </g>
      <!-- cracks -->
      <g stroke="#3a210c" stroke-width="2" fill="none" stroke-linecap="round">
        <path d="M14 10 L28 26 L20 40"/><path d="M122 10 L136 24 L128 42"/>
        <path d="M68 66 L82 80 L74 96"/><path d="M176 232 L190 246 L182 262"/>
      </g>
      <!-- neon outlines -->
      <g fill="none" stroke="#b6ff00" stroke-opacity="0.8" stroke-width="2" filter="url(#neon)">
        <rect x="54" y="0" width="54" height="54" rx="4" stroke-dasharray="6 6"/>
        <rect x="162" y="108" width="54" height="54" rx="4" stroke-dasharray="6 6"/>
      </g>
      <!-- chest -->
      <g transform="translate(108 162)">
        <rect x="6" y="14" width="42" height="32" rx="4" fill="#7a3fd1" stroke="#19f0ff" stroke-width="2"/>
        <path d="M6 24 Q27 4 48 24" fill="#9b5cff" stroke="#19f0ff" stroke-width="2"/>
        <rect x="22" y="26" width="10" height="12" rx="2" fill="#b6ff00"/>
      </g>
    </g>
  </g>

  <!-- center glow and bomb -->
  <circle cx="780" cy="270" r="230" fill="url(#glow)"/>
  <g transform="translate(780 285)" filter="url(#neon)">
    <circle r="120" fill="url(#bomb)" stroke="#8a2be2" stroke-width="5"/>
    <ellipse cx="-42" cy="-48" rx="34" ry="20" fill="#ffffff" opacity="0.14" transform="rotate(-30 -42 -48)"/>
    <!-- skull-less emblem: hex + lightning -->
    <polygon points="0,-62 54,-31 54,31 0,62 -54,31 -54,-31" fill="none" stroke="#b6ff00" stroke-width="5"/>
    <path d="M10 -36 L-20 6 H-2 L-10 38 L22 -8 H4 Z" fill="#b6ff00"/>
    <!-- cap and fuse -->
    <rect x="-26" y="-140" width="52" height="30" rx="6" fill="#2a2d55" stroke="#8a2be2" stroke-width="3"/>
    <path d="M0 -140 Q10 -178 44 -188 Q66 -192 76 -176" fill="none" stroke="#c98a4a" stroke-width="7" stroke-linecap="round"/>
  </g>
  <!-- spark -->
  <g transform="translate(858 98)" filter="url(#neon)">
    <circle r="26" fill="#ff9a1f" opacity="0.45"/>
    <path d="M0 -22 L5 -5 L22 0 L5 5 L0 22 L-5 5 L-22 0 L-5 -5 Z" fill="#fff3c0"/>
  </g>
  <g fill="#ff9a1f" opacity="0.9">
    <circle cx="905" cy="70" r="3"/><circle cx="830" cy="62" r="2.5"/><circle cx="888" cy="130" r="2.5"/><circle cx="822" cy="118" r="2"/>
  </g>

  <!-- small bombs -->
  <g>
    <g transform="translate(560 430)"><circle r="26" fill="url(#bomb)" stroke="#19f0ff" stroke-width="2.5"/><path d="M0 -26 Q6 -42 20 -46" stroke="#c98a4a" stroke-width="4" fill="none"/><circle cx="20" cy="-46" r="4" fill="#ff9a1f"/></g>
    <g transform="translate(1040 440)"><circle r="22" fill="url(#bomb)" stroke="#b6ff00" stroke-width="2.5"/><path d="M0 -22 Q6 -36 18 -40" stroke="#c98a4a" stroke-width="4" fill="none"/><circle cx="18" cy="-40" r="4" fill="#ff9a1f"/></g>
  </g>

  <!-- right: blast cross -->
  <g transform="translate(1130 250)" stroke="#ff9a1f" stroke-width="2" fill="#ff9a1f" fill-opacity="0.25" filter="url(#neon)">
    <rect x="-27" y="-27" width="54" height="54" rx="6"/>
    <rect x="27" y="-27" width="54" height="54" rx="6"/>
    <rect x="-81" y="-27" width="54" height="54" rx="6"/>
    <rect x="-27" y="-81" width="54" height="54" rx="6"/>
    <rect x="-27" y="27" width="54" height="54" rx="6"/>
  </g>
  <text x="1130" y="258" text-anchor="middle" font-family="'Courier New',monospace" font-weight="700" font-size="22" fill="#fff3c0">$BOMBERSI</text>

  <!-- corner ticks -->
  <g stroke="#b6ff00" stroke-width="2" fill="none" opacity="0.7">
    <path d="M16 40 V16 H40"/><path d="M1314 40 V16 H1290"/><path d="M16 512 V536 H40"/><path d="M1314 512 V536 H1290"/>
  </g>
</svg>
