<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Owl Ai Studio - Nexus Web3 Showcase</title>
    
    <!-- Google Model Viewer -->
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #05070d;
            background-image: 
                radial-gradient(circle at 50% 15%, rgba(0, 229, 255, 0.08) 0%, transparent 60%),
                radial-gradient(circle at 80% 80%, rgba(212, 175, 55, 0.06) 0%, transparent 50%),
                linear-gradient(to bottom, #05070d, #0b0f19);
            min-height: 100vh;
            font-family: 'Rajdhani', sans-serif;
            color: #fff;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Navbar Web3 Superior */
        nav {
            width: 100%;
            max-width: 1300px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 25px 40px;
            border-bottom: 1px solid rgba(212, 175, 55, 0.15);
            background: rgba(11, 15, 25, 0.7);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .nav-brand {
            display: flex;
            align-items: center;
            gap: 12px;
            font-family: 'Orbitron', sans-serif;
            font-weight: 800;
            font-size: 20px;
            letter-spacing: 2px;
            color: #d4af37;
            text-shadow: 0 0 10px rgba(212, 175, 55, 0.4);
        }

        .nav-brand span {
            color: #00e5ff;
        }

        .wallet-btn {
            background: linear-gradient(135deg, rgba(0, 229, 255, 0.15), rgba(0, 229, 255, 0.05));
            border: 1px solid #00e5ff;
            color: #00e5ff;
            padding: 10px 22px;
            border-radius: 8px;
            font-family: 'Orbitron', sans-serif;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.15);
        }

        .wallet-btn:hover {
            background: #00e5ff;
            color: #05070d;
            box-shadow: 0 0 25px rgba(0, 229, 255, 0.5);
        }

        /* Header Principal */
        header {
            text-align: center;
            margin: 45px 0 25px 0;
            padding: 0 20px;
        }

        header h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 36px;
            color: #d4af37;
            letter-spacing: 4px;
            text-transform: uppercase;
            text-shadow: 0 0 20px rgba(212, 175, 55, 0.5);
            margin-bottom: 10px;
        }

        header p {
            color: #8a99ad;
            font-size: 16px;
            letter-spacing: 1.5px;
        }

        /* Stats Bar da Coleção */
        .stats-bar {
            display: flex;
            gap: 40px;
            background: rgba(17, 24, 39, 0.6);
            border: 1px solid rgba(212, 175, 55, 0.2);
            padding: 15px 35px;
            border-radius: 12px;
            margin-bottom: 50px;
            backdrop-filter: blur(5px);
        }

        .stat-item {
            text-align: center;
        }

        .stat-item .value {
            font-family: 'Orbitron', sans-serif;
            font-size: 18px;
            color: #00e5ff;
            font-weight: 600;
        }

        .stat-item .label {
            font-size: 11px;
            color: #6b7c96;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Container das Cartas */
        .container {
            perspective: 1400px;
            display: flex;
            gap: 60px;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            max-width: 1200px;
            margin-bottom: 50px;
        }

        .card-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .nft-card {
            width: 320px;
            height: 445px;
            border-radius: 20px;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.1s ease-out, box-shadow 0.3s ease;
            cursor: pointer;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8), 
                        0 0 20px rgba(0, 229, 255, 0.15);
        }

        .nft-card:hover {
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.9), 
                        0 0 35px rgba(212, 175, 55, 0.45);
        }

        .card-face {
            width: 100%;
            height: 100%;
            border-radius: 18px;
            background-size: cover;
            background-position: center;
            position: absolute;
            top: 0;
            left: 0;
            transform: translateZ(20px);
            border: 2px solid rgba(212, 175, 55, 0.7);
            box-shadow: inset 0 0 25px rgba(0,0,0,0.6);
        }

        .card-foil {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 18px;
            mix-blend-mode: color-dodge;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            background: linear-gradient(
                135deg,
                rgba(255, 255, 255, 0) 0%,
                rgba(255, 215, 0, 0.4) 25%,
                rgba(0, 229, 255, 0.4) 50%,
                rgba(255, 255, 255, 0) 75%
            );
            transform: translateZ(35px);
        }

        .nft-card:hover .card-foil {
            opacity: 1;
        }

        .card-glare {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 18px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s ease;
            mix-blend-mode: overlay;
            transform: translateZ(40px);
        }

        .nft-card:hover .card-glare {
            opacity: 1;
        }

        /* Botões de Ação da Carta */
        .card-actions {
            display: flex;
            gap: 12px;
            width: 100%;
            max-width: 320px;
        }

        .btn {
            flex: 1;
            padding: 12px 0;
            font-family: 'Orbitron', sans-serif;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.25s ease;
            border: none;
        }

        .btn-3d {
            background: rgba(0, 229, 255, 0.1);
            color: #00e5ff;
            border: 1px solid rgba(0, 229, 255, 0.4);
        }

        .btn-3d:hover {
            background: rgba(0, 229, 255, 0.25);
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.4);
        }

        .btn-mint {
            background: linear-gradient(135deg, #d4af37, #aa8c2c);
            color: #05070d;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.35);
        }

        .btn-mint:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 22px rgba(212, 175, 55, 0.6);
        }

        /* Janela Modal 3D Estilizada */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 7, 13, 0.9);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            background: #111827;
            border: 2px solid #d4af37;
            border-radius: 20px;
            width: 90%;
            max-width: 650px;
            height: 520px;
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 0 50px rgba(0, 229, 255, 0.35);
        }

        .modal-header {
            padding: 18px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            background: rgba(0,0,0,0.3);
            border-top-left-radius: 18px;
            border-top-right-radius: 18px;
        }

        .modal-header h3 {
            font-family: 'Orbitron', sans-serif;
            color: #d4af37;
            letter-spacing: 2px;
            font-size: 15px;
        }

        .close-btn {
            background: none;
            border: none;
            color: #fff;
            font-size: 24px;
            cursor: pointer;
            transition: color 0.2s;
        }

        .close-btn:hover {
            color: #00e5ff;
        }

        model-viewer {
            width: 100%;
            height: 100%;
            background-color: transparent;
            filter: drop-shadow(0 0 20px rgba(0, 229, 255, 0.6));
        }

        footer {
            margin-top: auto;
            padding: 25px;
            color: #5c6c84;
            font-size: 13px;
            letter-spacing: 1px;
            border-top: 1px solid rgba(255,255,255,0.05);
            width: 100%;
            text-align: center;
            background: rgba(5, 7, 13, 0.8);
        }

        footer span {
            color: #00e5ff;
        }
    </style>
</head>
<body>

    <!-- Navbar Web3 -->
    <nav>
        <div class="nav-brand">
            OWL AI <span>STUDIO</span>
        </div>
        <button class="wallet-btn" onclick="alert('Conectando carteira Web3 (Phantom / Solflare)...')">Connect Wallet</button>
    </nav>

    <!-- Header Principal -->
    <header>
        <h1>Divine Holographic Vault</h1>
        <p>Explore AAA Web3 Collectibles in Real-Time 3D & Holographic Foil</p>
    </header>

    <!-- Estatísticas da Coleção -->
    <div class="stats-bar">
        <div class="stat-item">
            <div class="value">02 / 02</div>
            <div class="label">Divine Edition</div>
        </div>
        <div class="stat-item">
            <div class="value">Solana / DePIN</div>
            <div class="label">Network</div>
        </div>
        <div class="stat-item">
            <div class="value">100% On-Chain</div>
            <div class="label">Metadata Status</div>
        </div>
    </div>

    <!-- Grade de Cartas -->
    <div class="container">
        
        <!-- Carta 1: ORION -->
        <div class="card-wrapper">
            <div class="nft-card" data-card>
                <div class="card-face" style="background-image: url('Carta Divina ORION em Mármore Celestial.png');"></div>
                <div class="card-foil"></div>
                <div class="card-glare"></div>
            </div>
            <div class="card-actions">
                <button class="btn btn-3d" onclick="openModal('Orion')">View in 3D</button>
                <button class="btn btn-mint" onclick="alert('Iniciando Smart Contract Mint para Orion!')">Mint Card</button>
            </div>
        </div>

        <!-- Carta 2: AEON -->
        <div class="card-wrapper">
            <div class="nft-card" data-card>
                <div class="card-face" style="background-image: url('Carta Divina Aeon – Supremo Ancestral.png');"></div>
                <div class="card-foil"></div>
                <div class="card-glare"></div>
            </div>
            <div class="card-actions">
                <button class="btn btn-3d" onclick="openModal('Aeon')">View in 3D</button>
                <button class="btn btn-mint" onclick="alert('Iniciando Smart Contract Mint para Aeon!')">Mint Card</button>
            </div>
        </div>

    </div>

    <!-- Janela Modal do Visualizador 3D -->
    <div class="modal-overlay" id="modal3D">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle">OWL AI STUDIO - 3D VIEWER</h3>
                <button class="close-btn" onclick="closeModal()">&times;</button>
            </div>
            <model-viewer id="modelViewer" src="" alt="Modelo 3D do Personagem" auto-rotate camera-controls shadow-intensity="1">
            </model-viewer>
        </div>
    </div>

    <footer>
        Owl Ai Studio Engine &bull; Interactive Web3 Showcase &bull; <span>Play Beyond The Grid</span>
    </footer>

    <script>
        // Efeito 3D Tilt das Cartas
        const cards = document.querySelectorAll('[data-card]');

        cards.forEach(card => {
            card.addEventListener('mousemove', (e) => {
                const rect = card.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;

                const centerX = rect.width / 2;
                const centerY = rect.height / 2;

                const rotateX = -((y - centerY) / centerY) * 18;
                const rotateY = ((x - centerX) / centerX) * 18;

                card.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale(1.06)`;

                const foil = card.querySelector('.card-foil');
                const glare = card.querySelector('.card-glare');
                
                const percentX = (x / rect.width) * 100;
                const percentY = (y / rect.height) * 100;
                
                foil.style.backgroundPosition = `${percentX}% ${percentY}%`;
                glare.style.background = `radial-gradient(circle at ${percentX}% ${percentY}%, rgba(255,255,255,0.4) 0%, rgba(255,255,255,0.05) 60%, transparent 90%)`;
            });

            card.addEventListener('mouseleave', () => {
                card.style.transform = 'rotateX(0deg) rotateY(0deg) scale(1)';
            });
        });

        // Funções para o Modal 3D
        function openModal(characterName) {
            const modal = document.getElementById('modal3D');
            const title = document.getElementById('modalTitle');
            const viewer = document.getElementById('modelViewer');

            title.innerText = `OWL AI STUDIO - ${characterName.toUpperCase()} 3D MODEL`;
            
            if(characterName === 'Orion') {
                viewer.src = 'Orion.glb';
            } else {
                viewer.src = 'Aeon.glb';
            }

            modal.classList.add('active');
        }

        function closeModal() {
            const modal = document.getElementById('modal3D');
            modal.classList.remove('active');
            document.getElementById('modelViewer').src = '';
        }
    </script>

</body>
</html>
